name: Workset Release and Gym Mode Check

on:
  push:
    branches: [release/update-system-gym-mode]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - name: Build
        env:
          VITE_SUPABASE_URL: https://lplybuzlgowxeszkvtqe.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Verify release and install assets
        run: |
          test -f dist/version.json
          node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('dist/version.json','utf8'));if(!v.buildId)process.exit(1)"
          test -f dist/workset-icon-v1-32.png
          test -f dist/workset-icon-v1-180.png
          test -f dist/workset-icon-v1-192.png
          test -f dist/workset-icon-v1-512.png
          test -f dist/workset-icon-v1-maskable-512.png
