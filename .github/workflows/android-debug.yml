name: Build WorkSet Android (testing)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/nativeLocation.js'
      - 'src/outdoorTracking.jsx'
      - 'capacitor.config.json'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install packages
        run: npm install
      - name: Test
        run: npm test
      - name: Build native web assets
        run: npm run build:android
        env:
          WORKSET_NATIVE_BUILD: 'true'
          VITE_SUPABASE_URL: https://lplybuzlgowxeszkvtqe.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Generate Android wrapper and sync plugins
        run: |
          npx cap add android
          npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: bash gradlew --no-daemon assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkSet-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
