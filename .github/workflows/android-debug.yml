name: Build WorkSet Android (testing)

# Native packages remain on hold. Run explicitly from Actions when testing resumes.
on:
  push:
    branches:
      - native/workset-dual-build-2026-11-22
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub ubuntu-latest already has Android SDK cmdline-tools.
      # setup-android@v3 requests the retired "tools" package and fails.
      - name: Android SDK location
        run: |
          echo "Using Android SDK: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
      - name: Install packages
        run: npm install
      - name: Test
        run: npm test
      - name: Build native web assets
        run: npm run build:android
        env:
          WORKSET_NATIVE_BUILD: 'true'
          VITE_SUPABASE_URL: https://lplybuzlgowxeszkvtqe.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PUBLIC_APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Generate Android wrapper and sync plugins
        run: |
          npx cap add android
          npx cap sync android
      - name: Apply Option B native android artwork
        run: node scripts/apply-native-brand.mjs android
      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        working-directory: android
        run: bash gradlew --no-daemon --max-workers=2 assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkSet-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
