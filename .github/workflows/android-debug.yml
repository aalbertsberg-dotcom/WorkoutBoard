name: Build WorkSet Android (testing)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'native/android/**'
      - 'scripts/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android-debug.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/android/**'
      - 'scripts/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout$v4
      - name: Node 22
        uses: actions/setup-node$v4
        with:
          node-version: '22'
      - name: JDK 21
        uses: actions/setup-java$v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK location
        run: test -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
      - name: Install packages
        run: npm ci
      - name: Test
        run: npm test
      - name: Build native web assets
        run: npm run build:android
        env:
          WORKSET_NATIVE_BUILD: 'true'
          VITE_SUPABASE_URL: https://lplybuzlgowxeszkvtqe.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PUBLIC_APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Generate and prepare Android wrapper
        run: |
          npx cap add android
          npx cap sync android
          node scripts/prepare-android-native.mjs
      - name: Assemble Android test APK
        working-directory: android
        run: bash ./gradlew --no-daemon assembleDebug
      - name: Keep one APK filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WorkSet.apk
      - name: Upload WorkSet APK test package
        uses: actions/upload-artifact$v4
        with:
          name: WorkSet-Android-Test
          path: WorkSet.apk
          if-no-files-found: error
          retention-days: 14
