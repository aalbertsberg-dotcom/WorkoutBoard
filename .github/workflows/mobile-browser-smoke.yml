name: WorkSet Mobile Browser Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The web-first branch changes often. Cancel superseded runs so a single
# older failing screenshot test does not generate dozens of notifications.
concurrency:
  group: workset-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install WorkSet
        run: npm install
      - name: Install pinned browser test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Test mobile and desktop interactions
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_workset_smoke_test_only
        run: npx playwright test --config tests/playwright.config.cjs
